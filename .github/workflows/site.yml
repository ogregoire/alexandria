name: Publish the catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode verify

      # The catalogue is written by a plugin built in this same reactor, so it has to be in
      # the local repository before the goal can be resolved. Two steps, and not the Maven
      # site lifecycle: that would wrap the library in a report index, a skin and a set of
      # project-information pages.
      - name: Install
        run: ./mvnw --batch-mode install -DskipTests

      - name: Publish the catalogue
        run: ./mvnw --batch-mode alexandria:catalog

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
